<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="library">

    </div>
    <button id="new-book-button">Add New Book</button>
    <dialog class="add-new-book">
        <h2>ADD A NEW BOOK TO THE LIBRARY:</h2>
        <form>
            <label for="name">Name</label>
            <input type="text" id="name">

            <label for="author">Author</label>
            <input type="text" id="author">

            <label for="genre">Genre</label>
            <input type="text" id="genre">

            <label for="yearOfRelease">Year Of Release</label>
            <input type="text" id="yearOfRelease">

            <button type="button" id="submit-book-details">Add book</button>
            <button type="button" id="close-dialog-button">Cancel</button>
        </form>
    </dialog>
</body>
</html>
